<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Остров-ферма</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2e72a8;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:'Press Start 2P',monospace;color:#4a2f1d;font-size:10px}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.panel{background:#f3e3c1;border:3px solid #4a2f1d;box-shadow:inset -3px -3px 0 #d9bf8f,inset 3px 3px 0 #fff6de,0 3px 0 rgba(0,0,0,.25)}
#hud{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.hudrow{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 8px;line-height:1}
.hudrow img{width:24px;height:24px;image-rendering:pixelated}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:min(92vw,520px)}
.toast{padding:8px 12px;line-height:1.7;text-align:center;transition:opacity .5s}
#bottom{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:100vw}
#hint{padding:6px 10px;line-height:1.6;text-align:center;max-width:92vw;pointer-events:none}
#hint.dim{color:#8a6a4a}
#hint:empty{display:none}
#hotbar{display:flex;gap:6px;padding:6px}
.slot{position:relative;width:52px;height:52px;background:#e6cf9f;border:3px solid #a8713f;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot.sel{border-color:#4a2f1d;background:#fff3d1;box-shadow:inset 0 0 0 2px #f2cc4c}
.slot img{image-rendering:pixelated;pointer-events:none}
.slot img.main{width:40px;height:40px}
.slot img.mini{position:absolute;right:1px;top:1px;width:18px;height:18px;background:#fff3d1;border:1px solid #a8713f}
.slot .num{position:absolute;left:3px;top:3px;font-size:7px;color:#a8713f}
.slot .cnt{position:absolute;right:2px;bottom:3px;font-size:8px;color:#4a2f1d;text-shadow:1px 1px #fff6de}
.slot .bar{position:absolute;left:5px;right:5px;bottom:3px;height:5px;background:#4a2f1d}
.slot .bar i{display:block;height:100%;background:#5ec7e6}
.slot.bagslot{margin-left:8px;background:#d9b77a}
.slot.locked img.main{opacity:.35}
#modalWrap{position:fixed;inset:0;background:rgba(20,15,30,.5);display:flex;align-items:center;justify-content:center;padding:12px}
#modalWrap.hidden{display:none}
#modal{position:relative;width:min(500px,100%);max-height:92vh;overflow:auto;padding:16px 16px 12px}
#modal h2{font-size:13px;margin:0 30px 10px 0;line-height:1.5}
#modal h3{font-size:9px;margin:14px 0 6px;color:#a8713f;letter-spacing:1px}
#modal .say{line-height:1.8;margin-bottom:6px;color:#6e4527}
#modal .foot{line-height:1.8;margin-top:10px;font-size:9px;color:#6e4527}
.row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px dashed #d9bf8f}
.row:last-child{border-bottom:none}
.row img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.row .nm{flex:1;line-height:1.7;min-width:0}
.row small{display:block;font-size:8px;color:#8a6a4a}
.row .pr{display:flex;align-items:center;gap:3px;white-space:nowrap}
.row .pr img{width:16px;height:16px}
.btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
button.px{font:inherit;font-size:9px;padding:7px 8px;background:#6aa84f;color:#fff;border:3px solid #2f5a22;box-shadow:inset -2px -2px 0 #4c8a37,inset 2px 2px 0 #8ccc6a;cursor:pointer;text-shadow:1px 1px #2f5a22}
button.px:disabled{background:#b9b0a5;border-color:#7d756c;box-shadow:none;cursor:default;text-shadow:none}
button.px.alt{background:#c58c55;border-color:#6e4527;box-shadow:inset -2px -2px 0 #a8713f,inset 2px 2px 0 #e0b07a;text-shadow:1px 1px #6e4527}
button.px.red{background:#c4503c;border-color:#6e2a1e;box-shadow:inset -2px -2px 0 #9e3a2c,inset 2px 2px 0 #e07a62;text-shadow:1px 1px #6e2a1e}
#closeBtn{position:absolute;right:10px;top:10px;padding:5px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cell{background:#e6cf9f;border:3px solid #a8713f;padding:8px 4px;text-align:center;line-height:1.6;font-size:8px}
.cell img{width:40px;height:40px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.cell b{display:block;font-size:11px;color:#4a2f1d}
.cell button{margin-top:6px}
.cell.inhand{border-color:#4a2f1d;background:#fff3d1}
#help{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:8px 10px;line-height:1.9;font-size:8px;pointer-events:none}
#help b{color:#6e4527}
#fade{position:fixed;inset:0;background:#0b0d1e;opacity:0;pointer-events:none;transition:opacity .7s;display:flex;align-items:center;justify-content:center;color:#f3e3c1;font-size:14px}
#touch{display:none}
body.touch #touch{display:block}
body.touch #help{display:none}
#stick{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(110px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(243,227,193,.25);border:3px solid rgba(74,47,29,.5)}
#knob{position:absolute;left:36px;top:36px;width:42px;height:42px;border-radius:50%;background:#f3e3c1;border:3px solid #4a2f1d}
#actBtn{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;font:inherit;font-size:16px;background:#f2cc4c;border:4px solid #4a2f1d;color:#4a2f1d;box-shadow:inset -4px -4px 0 #c9962f}
#qBtn{position:fixed;right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(126px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;font:inherit;font-size:12px;background:#f3e3c1;border:3px solid #4a2f1d;color:#4a2f1d}
@media (max-width:600px){
  .slot{width:44px;height:44px}.slot img.main{width:32px;height:32px}.slot img.mini{width:15px;height:15px}
  #hotbar{gap:4px;padding:4px}.slot.bagslot{margin-left:4px}
  body{font-size:9px}
  #toasts{top:96px}
}
@media (max-width:1100px){#help{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel hudrow"><img id="timeIcon" alt=""><span id="clock">День 1 · 06:00</span></div>
  <div class="panel hudrow"><img id="coinIcon" alt=""><span id="coins">0</span></div>
</div>
<div id="help" class="panel">
  <b>WASD / стрелки</b> — ходить<br>
  <b>E / пробел / клик</b> — действие<br>
  <b>1–5 / колесо</b> — инвентарь<br>
  <b>Q</b> — что строить / какие семена<br>
  <b>I / Tab</b> — мешочек<br>
  <b>T</b> (держать) — ускорить время
</div>
<div id="toasts"></div>
<div id="bottom">
  <div id="hint" class="panel"></div>
  <div id="hotbar" class="panel"></div>
</div>
<div id="touch"><div id="stick"><div id="knob"></div></div><button id="qBtn">Q</button><button id="actBtn">E</button></div>
<div id="modalWrap" class="hidden"><div id="modal" class="panel"><button id="closeBtn" class="px alt">✕</button><div id="modalBody"></div></div></div>
<div id="fade"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
// ================= константы мира =================
const TS = 16, W = 48, H = 36, CX = 24, CY = 18, RX = 16, RY = 12;
const IW = 11, IH = 9; // комната в домике, в тайлах
const DAY = 1440, WET_MAX = 720, CAN_MAX = 10, FEED_CAP = 6, COOP_CAP = 4, EGG_CAP = 4, GROW_SPRUCE = 1440;
const MILL_NEED = { wood: 40, coins: 250 };
const ITEMS = {
  seedWheat: { name: 'Семена пшеницы', buy: 5, note: 'растёт ~2 мин, если полита' },
  seedCarrot: { name: 'Семена моркови', buy: 10, note: 'растёт ~3 мин' },
  seedBeet: { name: 'Семена свёклы', buy: 15, note: 'растёт ~4 мин, дорого продаётся' },
  seedPotato: { name: 'Семена картофеля', buy: 12, note: 'растёт ~3,5 мин, 2–3 клубня' },
  bed: { name: 'Грядка', acc: 'грядку', buy: 25, note: 'ставится молотком на траву' },
  coop: { name: 'Куриный домик', acc: 'куриный домик', buy: 80, note: '1 клетка: до 4 куриц и 4 яиц' },
  feeder: { name: 'Кормушка', acc: 'кормушку', buy: 30, note: 'насыпай в неё пшеницу' },
  fence: { name: 'Заборчик', acc: 'заборчик', buy: 4, note: 'низкий, но куры не перелезут' },
  gate: { name: 'Калитка', acc: 'калитку', buy: 12, note: 'E — открыть, закроется сама' },
  lamp: { name: 'Фонарь', acc: 'фонарь', buy: 40, note: 'ночью освещает всё вокруг' },
  fenceLamp: { name: 'Лампа для курятника', acc: 'лампу на забор', buy: 20, note: 'невысокая, ставится на заборчик' },
  sapling: { name: 'Саженец ёлки', acc: 'саженец ёлки', buy: 10, note: 'за сутки вырастает в ёлку' },
  millPlan: { name: 'Чертёж мельницы', acc: 'стройку мельницы', buy: 150, note: 'разметь место 3×3 молотком' },
  axe: { name: 'Топор', buy: 50, note: 'рубит взрослые ёлки, даёт древесину' },
  chicken: { name: 'Курица', buy: 60 },
  wood: { name: 'Древесина', sell: 5 },
  wheat: { name: 'Пшеница', sell: 12 },
  carrot: { name: 'Морковь', sell: 28 },
  beet: { name: 'Свёкла', sell: 45 },
  potato: { name: 'Картофель', sell: 18 },
  egg: { name: 'Яйцо', sell: 25 },
};
const CROPS = {
  wheat: { name: 'Пшеница', seed: 'seedWheat', item: 'wheat', grow: 600, yield: () => Math.random() < 0.3 ? 2 : 1, col: ['#f2cc4c', '#fbe590', '#c9962f'] },
  carrot: { name: 'Морковь', seed: 'seedCarrot', item: 'carrot', grow: 900, yield: () => 1, col: ['#f08a2b', '#4fae3c', '#ffb15a'] },
  beet: { name: 'Свёкла', seed: 'seedBeet', item: 'beet', grow: 1200, yield: () => 1, col: ['#8e1f4a', '#3f8f3a', '#c0386a'] },
  potato: { name: 'Картофель', seed: 'seedPotato', item: 'potato', grow: 1050, yield: () => Math.random() < 0.4 ? 3 : 2, col: ['#c9a063', '#5fb048', '#e6c48a'] },
};
const SEEDS = ['seedWheat', 'seedCarrot', 'seedBeet', 'seedPotato'];
const SEED_CROP = { seedWheat: 'wheat', seedCarrot: 'carrot', seedBeet: 'beet', seedPotato: 'potato' };
const BUILDS = ['bed', 'coop', 'feeder', 'fence', 'gate', 'lamp', 'fenceLamp', 'sapling', 'millPlan'];
const PRODUCE = ['wheat', 'carrot', 'beet', 'potato', 'egg', 'wood'];
const TOOLS = [
  { key: 'hammer', name: 'Молоток' },
  { key: 'sledge', name: 'Кувалда' },
  { key: 'can', name: 'Лейка' },
  { key: 'seeds', name: 'Семена' },
  { key: 'axe', name: 'Топор' },
];
const plural = (n, one, few, many) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? one : m >= 2 && m <= 4 && (h < 12 || h > 14) ? few : many; };

// ================= шум и форма острова =================
function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shoreR(a) { return 1 + 0.07 * Math.sin(3 * a + 0.6) + 0.05 * Math.sin(5 * a + 2.1) + 0.03 * Math.sin(8 * a + 4.0); }
// сколько примерно тайлов до берега (плюс — суша, минус — вода)
function landV(x, y) {
  const dx = (x - CX) / RX, dy = (y - CY) / RY;
  return (shoreR(Math.atan2(dy, dx)) - Math.hypot(dx, dy)) * 14;
}

// ================= раскладка острова =================
const HOUSE = { x: 15 * TS, y: 11 * TS };
const DOOR = { tx: 17, ty: 15 };
const CHEST = { tx: 20, ty: 15 };
const WELL = { tx: 12, ty: 17 };
const LAMP = { x: 15 * TS + 6, y: 16 * TS + 13 };
let pierTop = 28;
for (let ty = CY; ty < H; ty++) if (landV(28, ty + 0.5) < 0) { pierTop = ty - 1; break; }
const PIER = { x: 27 * TS, y: pierTop * TS, w: 2 * TS, h: (34 - pierTop) * TS };
const TRADER = { tx: 28, ty: 32 };
const CRATE = { tx: 27, ty: 33 };
const PIER_LAMP = { x: 29 * TS - 3, y: 34 * TS - 2 };
const BOAT = { x: 29 * TS + 3, y: 32 * TS - 2 };
const PATH = [[17.5, 16.2], [17.5, 22], [28, 22], [28, pierTop + 1]];

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  const t = l ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l)) : 0;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function pathDist(x, y) {
  let d = 1e9;
  for (let i = 0; i < PATH.length - 1; i++) d = Math.min(d, segDist(x, y, ...PATH[i], ...PATH[i + 1]));
  return d;
}
function onPier(px, py) { return px >= PIER.x && px < PIER.x + PIER.w && py >= PIER.y && py < PIER.y + PIER.h; }
function walkable(px, py) { return onPier(px, py) || landV(px / TS, py / TS) > 0.2; }

const colliders = [];
const addCol = (x, y, w, h) => colliders.push({ x, y, w, h });
addCol(HOUSE.x + 1, HOUSE.y + 40, 78, 40);
addCol(CHEST.tx * TS + 1, CHEST.ty * TS + 5, 14, 11);
addCol(WELL.tx * TS + 1, WELL.ty * TS + 4, 14, 12);
addCol(LAMP.x - 2, LAMP.y - 3, 4, 3);
addCol(TRADER.tx * TS + 3, TRADER.ty * TS + 6, 10, 10);
addCol(CRATE.tx * TS + 1, CRATE.ty * TS + 4, 14, 12);
addCol(PIER_LAMP.x - 2, PIER_LAMP.y - 3, 4, 3);

function reserved(tx, ty) {
  if (tx >= 13 && tx <= 21 && ty >= 9 && ty <= 18) return true;
  if (tx >= 21 && tx <= 31 && ty >= 11 && ty <= 19) return true;
  if (Math.abs(tx - WELL.tx) <= 1 && ty >= WELL.ty - 2 && ty <= WELL.ty + 1) return true;
  if (tx >= 25 && tx <= 31 && ty >= pierTop - 3) return true;
  return pathDist(tx + 0.5, ty + 0.5) < 1.4;
}

// ================= раскладка комнаты =================
const WIN_IN = [20, 120];
const HOUSE_COLS = [
  { x: 58, y: 44, w: 60, h: 15 }, // камин
  { x: 146, y: 50, w: 24, h: 40 }, // кровать
  { x: 130, y: 50, w: 12, h: 14 }, // тумбочка
  { x: 24, y: 84, w: 32, h: 14 }, // стол
  { x: 8, y: 90, w: 12, h: 10 }, // стул
  { x: 6, y: 52, w: 14, h: 12 }, // фикус
];
function houseWalk(px, py) {
  if (py > 138) return px >= 78 && px <= 98 && py < 148;
  return px >= 5 && px <= IW * TS - 5 && py >= 50;
}

// ================= рисование спрайтов =================
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function pen(c, ox = 0, oy = 0) {
  const g = c.getContext('2d');
  return {
    g,
    r(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x + ox, y + oy, w, h); },
    p(x, y, col) { g.fillStyle = col; g.fillRect(x + ox, y + oy, 1, 1); },
    circ(cx, cy, r, col) {
      g.fillStyle = col;
      for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
        if (dx * dx + dy * dy <= r * r) g.fillRect(x + ox, y + oy, 1, 1);
      }
    },
  };
}
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function outline(c, col) {
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const d = g.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  const [R, G, B] = hexRGB(col);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (a[i + 3] > 0) continue;
    if ((x > 0 && a[i - 1] > 127) || (x < w - 1 && a[i + 7] > 127) || (y > 0 && a[i - w * 4 + 3] > 127) || (y < h - 1 && a[i + w * 4 + 3] > 127)) {
      o[i] = R; o[i + 1] = G; o[i + 2] = B; o[i + 3] = 255;
    }
  }
  d.data.set(o); g.putImageData(d, 0, 0);
  return c;
}
function mirror(c) {
  const m = canvas(c.width, c.height), g = m.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
  return m;
}

const PAL_FARMER = { hat: '#e8c25a', hatD: '#b98a36', hatL: '#f8e08a', band: '#c84b3a', hair: '#7a4428', skin: '#f2c29b', skinD: '#d99a72', shirt: '#f4ead0', shirtD: '#cdbb92', over: '#3d6fb0', overD: '#2c4f86', btn: '#f0c94a', boot: '#6a4128', bootD: '#4a2c1a' };
const PAL_TRADER = { hat: '#7a5230', hatD: '#55381f', hatL: '#9a6b40', band: '#3aa39a', hair: '#8a8a92', skin: '#e9b48c', skinD: '#c98d68', shirt: '#8c5bb5', shirtD: '#6a4392', over: '#6a4392', overD: '#4f2f72', btn: '#f0c94a', boot: '#4a3020', bootD: '#2e1d12', beard: '#e6e0d4' };

// dir: 0 вниз, 1 вверх, 2 вправо; frame: 0 стоит, 1 и 2 шаги
function makePerson(pal, dir, frame) {
  const c = canvas(18, 26), P = pen(c, 1, 1), r = P.r, p = P.p, EYE = '#2b1d2e';
  if (dir !== 2) {
    const lUp = frame === 1 ? 1 : 0, rUp = frame === 2 ? 1 : 0;
    r(4, 17, 8, 2, pal.over);
    r(4, 19, 3, 2 - lUp, pal.over); r(9, 19, 3, 2 - rUp, pal.over);
    r(4, 21 - lUp, 3, 2, pal.boot); r(9, 21 - rUp, 3, 2, pal.boot);
    r(4, 22 - lUp, 3, 1, pal.bootD); r(9, 22 - rUp, 3, 1, pal.bootD);
    r(4, 11, 8, 6, pal.shirt);
    if (dir === 0) {
      r(5, 13, 6, 3, pal.over); r(5, 11, 1, 2, pal.over); r(10, 11, 1, 2, pal.over);
      p(5, 13, pal.btn); p(10, 13, pal.btn);
    } else {
      r(4, 14, 8, 2, pal.over); r(5, 11, 1, 3, pal.over); r(10, 11, 1, 3, pal.over); r(6, 13, 4, 1, pal.over);
    }
    r(4, 16, 8, 1, pal.overD);
    const aL = frame === 1 ? 1 : 0, aR = frame === 2 ? 1 : 0;
    r(3, 11 + aL, 1, 3, pal.shirtD); r(3, 14 + aL, 1, 2, pal.skin);
    r(12, 11 + aR, 1, 3, pal.shirtD); r(12, 14 + aR, 1, 2, pal.skin);

function makeWheat(stage, sway) {

      P.p(x - 1, y - 3, '#b98d38');

  P.r(cx - 2, h - 6, 4, 6, '#7a4f2c'); P.r(cx - 2, h - 6, 1, 6, '#946238');

function update(dt) {

      o.closeT = far ? (o.closeT || 0) + dt : 0;

      <div class="btns"><button class="px" data-buy="millPlan" data-n="1" ${owned || state.coins < ITEMS.millPlan.buy ? 'disabled' : ''}>${owned ? 'Есть' : 'Купить'}</button></div></div>`;
    })()}
    <h3>ЖИВОТНЫЕ</h3><div class="row">${img('chicken')}<div class="nm">Курица<small>ест пшеницу из кормушки и несёт яйца · ${chickNote} · у тебя: ${state.chickens.length}</small></div>
      <div class="pr">${img('coin')}${cost}</div>
      <div class="btns"><button class="px" data-chicken="1" ${!free || state.coins < cost ? 'disabled' : ''}>Купить</button></div></div>
    <div class="foot">У тебя ${state.coins} монет. Урожай и яйца продаются через сундук у домика.</div>`;
  });
}
function openChest() {
  openModal(() => {
    const sum = PRODUCE.reduce((s, k) => s + state.chest[k] * ITEMS[k].sell, 0);
    return `<h2>Сундук для продажи</h2><div class="say">Положи товар — утром в 6:00 скупщик заберёт его и оставит монеты.</div>
    ${PRODUCE.map(k => `<div class="row">${img(k)}<div class="nm">${ITEMS[k].name}<small>в мешочке: ${state.bag[k]} · в сундуке: ${state.chest[k]}</small></div>
      <div class="pr">${img('coin')}${ITEMS[k].sell}</div>
      <div class="btns"><button class="px" data-put="${k}" data-n="1" ${state.bag[k] ? '' : 'disabled'}>+1</button>
      <button class="px" data-put="${k}" data-n="all" ${state.bag[k] ? '' : 'disabled'}>Всё</button>
      <button class="px alt" data-take="${k}" ${state.chest[k] ? '' : 'disabled'}>Забрать</button></div></div>`).join('')}
    <div class="foot">Утром получишь: ${sum} монет. Пшеницу стоит оставить и для кормушки.</div>`;
  });
}
function openSite() {
  openModal(() => `<h2>Стройка мельницы</h2>
    <div class="say">Место размечено: 3×3 клетки. Для постройки понадобится:</div>
    <div class="row">${img('wood')}<div class="nm">Древесина<small>в мешочке: ${state.bag.wood}</small></div><div class="pr">${MILL_NEED.wood}</div></div>
    <div class="row">${img('coin')}<div class="nm">Монеты<small>у тебя: ${state.coins}</small></div><div class="pr">${MILL_NEED.coins}</div></div>
    <div class="foot">Строительство скоро откроется — пока запасай древесину: руби ёлки топором и сажай новые.<br>
    Передумал с местом? Снеси стройку кувалдой — чертёж вернётся в мешочек.</div>`);
}
function openBag() {
  if (busy) return;
  const cell = (k, btn) => `<div class="cell ${btn && btn.on ? 'inhand' : ''}">${img(k)}<b>×${state.bag[k]}</b>${ITEMS[k].name}
    ${btn ? `<br><button class="px ${btn.on ? 'alt' : ''}" data-${btn.attr}="${k}">${btn.on ? 'В руке' : 'Взять'}</button>` : ''}</div>`;
  openModal(() => `<h2>Мешочек</h2>
    <h3>СЕМЕНА</h3><div class="grid">${SEEDS.map(k => cell(k, { attr: 'hand', on: state.seedType === k })).join('')}</div>
    <h3>УРОЖАЙ И РЕСУРСЫ</h3><div class="grid">${PRODUCE.map(k => cell(k)).join('')}</div>
    <h3>ПОСТРОЙКИ</h3><div class="grid">${BUILDS.map(k => cell(k, { attr: 'build', on: state.buildType === k })).join('')}</div>
    <div class="foot">Постройки ставятся молотком (1), сносятся кувалдой (2) и возвращаются сюда.<br>
    Лейка (3): ${state.water}/${CAN_MAX}. Топор (5): ${state.hasAxe ? 'есть' : 'нет'}. Куриц: ${state.chickens.length}.</div>
    <div style="text-align:right;margin-top:10px"><button class="px red" data-reset="ask">Начать заново</button></div>`);
}

// ================= цикл =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); updateHUD(false);
  requestAnimationFrame(frame);
}
setInterval(() => { if (!paused()) save(); }, 4000);
addEventListener('beforeunload', save);
addEventListener('pagehide', save);
updateCamera(); updateHUD(true);
if (freshGame) toast('Добро пожаловать на остров! Пшеница на грядках уже созрела — собери её (E).');
requestAnimationFrame(frame);
</script>
</body>
</html>
