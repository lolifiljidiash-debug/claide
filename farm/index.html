<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Остров-ферма</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2e72a8;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:'Press Start 2P',monospace;color:#4a2f1d;font-size:10px}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.panel{background:#f3e3c1;border:3px solid #4a2f1d;box-shadow:inset -3px -3px 0 #d9bf8f,inset 3px 3px 0 #fff6de,0 3px 0 rgba(0,0,0,.25)}
#hud{position:fixed;left:10px;top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.hudrow{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 8px;line-height:1}
.hudrow img{width:24px;height:24px;image-rendering:pixelated}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:min(92vw,520px)}
.toast{padding:8px 12px;line-height:1.7;text-align:center;transition:opacity .5s}
#bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:100vw}
#hint{padding:6px 10px;line-height:1.6;text-align:center;max-width:92vw;pointer-events:none}
#hint.dim{color:#8a6a4a}
#hint:empty{display:none}
#hotbar{display:flex;gap:6px;padding:6px}
.slot{position:relative;width:52px;height:52px;background:#e6cf9f;border:3px solid #a8713f;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot.sel{border-color:#4a2f1d;background:#fff3d1;box-shadow:inset 0 0 0 2px #f2cc4c}
.slot img{width:40px;height:40px;image-rendering:pixelated;pointer-events:none}
.slot .num{position:absolute;left:3px;top:3px;font-size:7px;color:#a8713f}
.slot .cnt{position:absolute;right:2px;bottom:3px;font-size:8px;color:#4a2f1d;text-shadow:1px 1px #fff6de}
.slot .bar{position:absolute;left:5px;right:5px;bottom:3px;height:5px;background:#4a2f1d}
.slot .bar i{display:block;height:100%;background:#5ec7e6}
.slot.bagslot{margin-left:8px;background:#d9b77a}
#modalWrap{position:fixed;inset:0;background:rgba(20,15,30,.5);display:flex;align-items:center;justify-content:center;padding:12px}
#modalWrap.hidden{display:none}
#modal{position:relative;width:min(480px,100%);max-height:92vh;overflow:auto;padding:16px 16px 12px}
#modal h2{font-size:13px;margin:0 30px 10px 0;line-height:1.5}
#modal .say{line-height:1.8;margin-bottom:10px;color:#6e4527}
#modal .foot{line-height:1.8;margin-top:10px;font-size:9px;color:#6e4527}
.row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px dashed #d9bf8f}
.row:last-child{border-bottom:none}
.row img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.row .nm{flex:1;line-height:1.7}
.row small{display:block;font-size:8px;color:#8a6a4a}
.row .pr{display:flex;align-items:center;gap:3px;white-space:nowrap}
.row .pr img{width:16px;height:16px}
.btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
button.px{font:inherit;font-size:9px;padding:7px 8px;background:#6aa84f;color:#fff;border:3px solid #2f5a22;box-shadow:inset -2px -2px 0 #4c8a37,inset 2px 2px 0 #8ccc6a;cursor:pointer;text-shadow:1px 1px #2f5a22}
button.px:disabled{background:#b9b0a5;border-color:#7d756c;box-shadow:none;cursor:default;text-shadow:none}
button.px.alt{background:#c58c55;border-color:#6e4527;box-shadow:inset -2px -2px 0 #a8713f,inset 2px 2px 0 #e0b07a;text-shadow:1px 1px #6e4527}
button.px.red{background:#c4503c;border-color:#6e2a1e;box-shadow:inset -2px -2px 0 #9e3a2c,inset 2px 2px 0 #e07a62;text-shadow:1px 1px #6e2a1e}
#closeBtn{position:absolute;right:10px;top:10px;padding:5px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cell{background:#e6cf9f;border:3px solid #a8713f;padding:8px 4px;text-align:center;line-height:1.6;font-size:8px}
.cell img{width:40px;height:40px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.cell b{display:block;font-size:11px;color:#4a2f1d}
.cell button{margin-top:6px}
.cell.inhand{border-color:#4a2f1d;background:#fff3d1}
#help{position:fixed;right:10px;top:10px;padding:8px 10px;line-height:1.9;font-size:8px;pointer-events:none}
#help b{color:#6e4527}
#fade{position:fixed;inset:0;background:#0b0d1e;opacity:0;pointer-events:none;transition:opacity .7s;display:flex;align-items:center;justify-content:center;color:#f3e3c1;font-size:14px}
#touch{display:none}
body.touch #touch{display:block}
body.touch #help{display:none}
#stick{position:fixed;left:18px;bottom:110px;width:120px;height:120px;border-radius:50%;background:rgba(243,227,193,.25);border:3px solid rgba(74,47,29,.5)}
#knob{position:absolute;left:36px;top:36px;width:42px;height:42px;border-radius:50%;background:#f3e3c1;border:3px solid #4a2f1d}
#actBtn{position:fixed;right:18px;bottom:120px;width:78px;height:78px;border-radius:50%;font:inherit;font-size:16px;background:#f2cc4c;border:4px solid #4a2f1d;color:#4a2f1d;box-shadow:inset -4px -4px 0 #c9962f}
@media (max-width:600px){
  .slot{width:44px;height:44px}.slot img{width:32px;height:32px}
  #hotbar{gap:4px;padding:4px}.slot.bagslot{margin-left:4px}
  body{font-size:9px}
  #toasts{top:96px}
}
@media (max-width:1100px){#help{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel hudrow"><img id="timeIcon" alt=""><span id="clock">День 1 · 06:00</span></div>
  <div class="panel hudrow"><img id="coinIcon" alt=""><span id="coins">0</span></div>
</div>
<div id="help" class="panel">
  <b>WASD / стрелки</b> — ходить<br>
  <b>E / пробел / клик</b> — действие<br>
  <b>1–4 / колесо</b> — инвентарь<br>
  <b>Q</b> — сменить семена<br>
  <b>I / Tab</b> — мешочек<br>
  <b>T</b> (держать) — ускорить время
</div>
<div id="toasts"></div>
<div id="bottom">
  <div id="hint" class="panel"></div>
  <div id="hotbar" class="panel"></div>
</div>
<div id="touch"><div id="stick"><div id="knob"></div></div><button id="actBtn">E</button></div>
<div id="modalWrap" class="hidden"><div id="modal" class="panel"><button id="closeBtn" class="px alt">✕</button><div id="modalBody"></div></div></div>
<div id="fade"></div>

<script>
'use strict';
// ================= константы мира =================
const TS = 16, W = 48, H = 36, CX = 24, CY = 18, RX = 16, RY = 12;
const DAY = 1440, WET_MAX = 720, CAN_MAX = 10;
const ITEMS = {
  seedWheat: { name: 'Семена пшеницы', buy: 5, note: 'растёт ~2 мин, если полита' },
  seedCarrot: { name: 'Семена моркови', buy: 10, note: 'растёт ~3 мин, любит воду' },
  bed: { name: 'Грядка', buy: 25, note: 'ставится молотком на траву' },
  wheat: { name: 'Пшеница', sell: 12 },
  carrot: { name: 'Морковь', sell: 28 },
};
const CROPS = {
  wheat: { name: 'Пшеница', seed: 'seedWheat', item: 'wheat', grow: 600 },
  carrot: { name: 'Морковь', seed: 'seedCarrot', item: 'carrot', grow: 900 },
};
const SEED_CROP = { seedWheat: 'wheat', seedCarrot: 'carrot' };
const TOOLS = [
  { key: 'hammer', name: 'Молоток' },
  { key: 'sledge', name: 'Кувалда' },
  { key: 'can', name: 'Лейка' },
  { key: 'seeds', name: 'Семена' },
];

// ================= шум и форма острова =================
function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shoreR(a) { return 1 + 0.07 * Math.sin(3 * a + 0.6) + 0.05 * Math.sin(5 * a + 2.1) + 0.03 * Math.sin(8 * a + 4.0); }
// сколько примерно тайлов до берега (плюс — суша, минус — вода)
function landV(x, y) {
  const dx = (x - CX) / RX, dy = (y - CY) / RY;
  return (shoreR(Math.atan2(dy, dx)) - Math.hypot(dx, dy)) * 14;
}

// ================= раскладка =================
const HOUSE = { x: 15 * TS, y: 11 * TS };
const DOOR = { tx: 17, ty: 15 };
const CHEST = { tx: 20, ty: 15 };
const WELL = { tx: 12, ty: 17 };
const LAMP = { x: 15 * TS + 6, y: 16 * TS + 13 };
let pierTop = 28;
for (let ty = CY; ty < H; ty++) if (landV(28, ty + 0.5) < 0) { pierTop = ty - 1; break; }
const PIER = { x: 27 * TS, y: pierTop * TS, w: 2 * TS, h: (34 - pierTop) * TS };
const TRADER = { tx: 28, ty: 32 };
const CRATE = { tx: 27, ty: 33 };
const PIER_LAMP = { x: 29 * TS - 3, y: 34 * TS - 2 };
const BOAT = { x: 29 * TS + 3, y: 32 * TS - 2 };
const PATH = [[17.5, 16.2], [17.5, 22], [28, 22], [28, pierTop + 1]];

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  const t = l ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l)) : 0;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function pathDist(x, y) {
  let d = 1e9;
  for (let i = 0; i < PATH.length - 1; i++) d = Math.min(d, segDist(x, y, ...PATH[i], ...PATH[i + 1]));
  return d;
}
function onPier(px, py) { return px >= PIER.x && px < PIER.x + PIER.w && py >= PIER.y && py < PIER.y + PIER.h; }
function walkable(px, py) { return onPier(px, py) || landV(px / TS, py / TS) > 0.2; }

const colliders = [];
const addCol = (x, y, w, h) => colliders.push({ x, y, w, h });
addCol(HOUSE.x + 1, HOUSE.y + 40, 78, 40);
addCol(CHEST.tx * TS + 1, CHEST.ty * TS + 5, 14, 11);
addCol(WELL.tx * TS + 1, WELL.ty * TS + 4, 14, 12);
addCol(LAMP.x - 2, LAMP.y - 3, 4, 3);
addCol(TRADER.tx * TS + 3, TRADER.ty * TS + 6, 10, 10);
addCol(CRATE.tx * TS + 1, CRATE.ty * TS + 4, 14, 12);
addCol(PIER_LAMP.x - 2, PIER_LAMP.y - 3, 4, 3);

function reserved(tx, ty) {
  if (tx >= 13 && tx <= 21 && ty >= 9 && ty <= 18) return true;
  if (tx >= 21 && tx <= 31 && ty >= 11 && ty <= 19) return true;
  if (Math.abs(tx - WELL.tx) <= 1 && ty >= WELL.ty - 2 && ty <= WELL.ty + 1) return true;
  if (tx >= 25 && tx <= 31 && ty >= pierTop - 3) return true;
  return pathDist(tx + 0.5, ty + 0.5) < 1.4;
}

// ================= рисование спрайтов =================
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function pen(c, ox = 0, oy = 0) {
  const g = c.getContext('2d');
  const P = {
    g,
    r(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x + ox, y + oy, w, h); },
    p(x, y, col) { g.fillStyle = col; g.fillRect(x + ox, y + oy, 1, 1); },
    circ(cx, cy, r, col) {
      g.fillStyle = col;
      for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
        if (dx * dx + dy * dy <= r * r) g.fillRect(x + ox, y + oy, 1, 1);
      }
    },
  };
  return P;
}
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function outline(c, col) {
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const d = g.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  const [R, G, B] = hexRGB(col);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (a[i + 3] > 0) continue;
    if ((x > 0 && a[i - 1] > 127) || (x < w - 1 && a[i + 7] > 127) || (y > 0 && a[i - w * 4 + 3] > 127) || (y < h - 1 && a[i + w * 4 + 3] > 127)) {
      o[i] = R; o[i + 1] = G; o[i + 2] = B; o[i + 3] = 255;
    }
  }
  d.data.set(o); g.putImageData(d, 0, 0);
  return c;
}
function mirror(c) {
  const m = canvas(c.width, c.height), g = m.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
  return m;
}

const PAL_FARMER = { hat: '#e8c25a', hatD: '#b98a36', hatL: '#f8e08a', band: '#c84b3a', hair: '#7a4428', skin: '#f2c29b', skinD: '#d99a72', shirt: '#f4ead0', shirtD: '#cdbb92', over: '#3d6fb0', overD: '#2c4f86', btn: '#f0c94a', boot: '#6a4128', bootD: '#4a2c1a' };
const PAL_TRADER = { hat: '#7a5230', hatD: '#55381f', hatL: '#9a6b40', band: '#3aa39a', hair: '#8a8a92', skin: '#e9b48c', skinD: '#c98d68', shirt: '#8c5bb5', shirtD: '#6a4392', over: '#6a4392', overD: '#4f2f72', btn: '#f0c94a', boot: '#4a3020', bootD: '#2e1d12', beard: '#e6e0d4' };

// dir: 0 вниз, 1 вверх, 2 вправо; frame: 0 стоит, 1 и 2 шаги
function makePerson(pal, dir, frame) {
  const c = canvas(18, 26), P = pen(c, 1, 1), r = P.r, p = P.p, EYE = '#2b1d2e';
  if (dir !== 2) {
    const lUp = frame === 1 ? 1 : 0, rUp = frame === 2 ? 1 : 0;
    r(4, 17, 8, 2, pal.over);
    r(4, 19, 3, 2 - lUp, pal.over); r(9, 19, 3, 2 - rUp, pal.over);
    r(4, 21 - lUp, 3, 2, pal.boot); r(9, 21 - rUp, 3, 2, pal.boot);
    r(4, 22 - lUp, 3, 1, pal.bootD); r(9, 22 - rUp, 3, 1, pal.bootD);
    r(4, 11, 8, 6, pal.shirt);
    if (dir === 0) {
      r(5, 13, 6, 3, pal.over); r(5, 11, 1, 2, pal.over); r(10, 11, 1, 2, pal.over);
      p(5, 13, pal.btn); p(10, 13, pal.btn);
    } else {
      r(4, 14, 8, 2, pal.over); r(5, 11, 1, 3, pal.over); r(10, 11, 1, 3, pal.over); r(6, 13, 4, 1, pal.over);
    }
    r(4, 16, 8, 1, pal.overD);
    const aL = frame === 1 ? 1 : 0, aR = frame === 2 ? 1 : 0;
    r(3, 11 + aL, 1, 3, pal.shirtD); r(3, 14 + aL, 1, 2, pal.skin);
    r(12, 11 + aR, 1, 3, pal.shirtD); r(12, 14 + aR, 1, 2, pal.skin);
    if (dir === 0) {
      r(4, 6, 8, 1, pal.hair); r(4, 7, 1, 2, pal.hair); r(11, 7, 1, 2, pal.hair);
      r(5, 6, 6, 5, pal.skin); r(5, 6, 6, 1, pal.skinD);
      p(6, 8, EYE); p(9, 8, EYE); p(5, 9, '#e8907a'); p(10, 9, '#e8907a');
      if (pal.beard) { r(5, 9, 6, 2, pal.beard); r(6, 11, 4, 1, pal.beard); p(5, 9, pal.beard); }
    } else {
      r(4, 6, 8, 4, pal.hair); r(5, 10, 6, 1, pal.skinD);
    }
    r(5, 1, 6, 4, pal.hat); r(6, 1, 4, 1, pal.hatL); r(5, 4, 6, 1, pal.band);
    r(2, 5, 12, 1, pal.hat); p(2, 5, pal.hatD); p(13, 5, pal.hatD);
    if (dir === 1) r(3, 6, 10, 1, pal.hatD);
  } else {
    r(5, 17, 6, 2, pal.over);
    if (frame === 0) {
      r(6, 19, 4, 2, pal.over); r(6, 21, 5, 2, pal.boot); r(6, 22, 5, 1, pal.bootD);
    } else {
      const back = frame === 1 ? pal.overD : pal.over, front = frame === 1 ? pal.over : pal.overD;
      r(4, 19, 2, 2, back); r(3, 21, 3, 2, pal.bootD);
      r(9, 19, 2, 2, front); r(9, 21, 3, 2, pal.boot);
    }
    r(5, 11, 6, 6, pal.shirt); r(5, 14, 6, 2, pal.over); r(8, 12, 3, 2, pal.over); p(7, 11, pal.over);
    r(5, 16, 6, 1, pal.overD);
    if (frame === 0) { r(7, 12, 2, 3, pal.shirtD); r(7, 15, 2, 1, pal.skin); }
    else if (frame === 1) { r(8, 12, 2, 3, pal.shirtD); r(9, 15, 2, 1, pal.skin); }
    else { r(6, 12, 2, 3, pal.shirtD); r(5, 15, 2, 1, pal.skin); }
    r(5, 6, 6, 5, pal.hair); r(7, 6, 4, 5, pal.skin); r(7, 6, 4, 1, pal.skinD);
    p(11, 8, pal.skin); p(9, 8, EYE); p(9, 9, '#e8907a'); p(7, 8, pal.skinD);
    if (pal.beard) { r(8, 9, 3, 2, pal.beard); p(11, 9, pal.beard); r(8, 11, 2, 1, pal.beard); }
    r(5, 1, 6, 4, pal.hat); r(6, 1, 4, 1, pal.hatL); r(5, 4, 6, 1, pal.band);
    r(3, 5, 11, 1, pal.hat); p(3, 5, pal.hatD);
  }
  return outline(c, '#2b1d2e');
}
function personSet(pal) {
  const s = [[], [], [], []];
  for (let f = 0; f < 3; f++) {
    s[0][f] = makePerson(pal, 0, f);
    s[1][f] = makePerson(pal, 1, f);
    s[2][f] = makePerson(pal, 2, f);
    s[3][f] = mirror(s[2][f]);
  }
  return s;
}

function seedDots(P) {
  for (const [x, y] of [[4, 15], [9, 13], [7, 18], [11, 17], [12, 12]]) { P.p(x, y, '#ecd9a6'); P.p(x, y + 1, '#4a2e1b'); }
}
function makeWheat(stage, sway) {
  const c = canvas(16, 24), P = pen(c);
  if (stage === 0) { seedDots(P); return c; }
  const G = '#6cbf45', GD = '#4c9a35', GL = '#9ad86a';
  const spots = stage === 1 ? [[4, 19], [8, 16], [12, 19]] : [[3, 20], [6, 16], [9, 20], [12, 16], [11, 21]];
  const h = [0, 2, 5, 8, 11][stage];
  for (const [x, y] of spots) {
    if (stage < 4) {
      for (let i = 1; i <= h; i++) P.p(x, y - i, i > h - 2 ? GL : G);
      if (stage === 1) P.p(x - 1, y - 2, GL);
      if (h >= 5) { P.p(x - 1, y - 3, GD); P.p(x + 1, y - 5, G); }
      if (stage === 3) { P.p(x - 1, y - h + 1, '#b5d86a'); P.p(x, y - h, '#cfe48a'); P.p(x + 1, y - h + 2, G); }
    } else {
      for (let i = 1; i <= h - 3; i++) P.p(x + (i > h - 6 ? sway : 0), y - i, i < 4 ? '#b98d38' : '#d9b04a');
      P.p(x - 1, y - 3, '#b98d38');
      const hx = x + sway, hy = y - h;
      P.r(hx - 1, hy, 3, 4, '#f2cc4c'); P.r(hx - 1, hy, 1, 4, '#c9962f');
      P.p(hx, hy, '#fbe590'); P.p(hx + 1, hy + 1, '#fbe590'); P.p(hx, hy - 1, '#e0b440');
    }
  }
  return outline(c, stage === 4 ? '#6e4a1c' : '#2d5a24');
}
function makeCarrot(stage) {
  const c = canvas(16, 24), P = pen(c);
  if (stage === 0) { seedDots(P); return c; }
  const G = '#4fae3c', GD = '#3a8a2c', GL = '#7fd05a';
  for (const [x, y] of [[4, 19], [8, 15], [12, 19]]) {

  ctx.fillRect(sx - r, sy - 1, r * 2, 2); ctx.fillRect(sx - r + 2, sy - 2, r * 2 - 4, 1); ctx.fillRect(sx - r + 2, sy + 1, r * 2 - 4, 1);
}

function update(dt) {
  time += dt;
  const prevCX = camX, prevCY = camY;
  if (!paused()) {
    advanceTime(dt * (keys.KeyT ? 60 : 5));
    let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
    let my = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + joy.y;
    const l = Math.hypot(mx, my);
    player.moving = l > 0.2;
    if (player.moving) {
      if (l > 1) { mx /= l; my /= l; }
      player.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 2 : 3) : (my > 0 ? 0 : 1);
      const sp = 72 * dt;
      if (!blocked(player.x + mx * sp, player.y)) player.x += mx * sp;
      if (!blocked(player.x, player.y + my * sp)) player.y += my * sp;
      player.walkT += dt;
    } else player.walkT = 0;
    player.actT = Math.max(0, player.actT - dt);
  }
  rainI += ((state.rain.on ? 1 : 0) - rainI) * Math.min(1, dt * 0.6);
  updateCamera();
  // частицы
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > p.life) parts.splice(i, 1);
  }
  if (Math.random() < dt * 2.5) smoke.push({ x: HOUSE.x + 63 + (Math.random() - 0.5) * 4, y: HOUSE.y - 2, t: 0, life: 2.5 + Math.random(), s: 2 + Math.floor(Math.random() * 2) });
  for (let i = smoke.length - 1; i >= 0; i--) {
    const s = smoke[i]; s.t += dt; s.y -= 9 * dt; s.x += (6 + Math.sin(s.t * 2) * 4) * dt;
    if (s.t > s.life) smoke.splice(i, 1);
  }
  // дождь
  const want = Math.floor(170 * rainI * view.w * view.h / (320 * 180));
  while (drops.length < want) drops.push(newDrop(true));
  if (drops.length > want) drops.length = want;
  const dcx = camX - prevCX, dcy = camY - prevCY;
  for (const d of drops) {
    d.x += -35 * dt - dcx; d.y += d.spd * dt - dcy; d.life -= dt;
    if (d.life <= 0) { splashes.push({ x: d.x + camX, y: d.y + camY, t: 0 }); Object.assign(d, newDrop(false)); }
  }
  for (let i = splashes.length - 1; i >= 0; i--) if ((splashes[i].t += dt) > 0.3) splashes.splice(i, 1);
  // светлячки и бабочки
  for (const f of flies) {
    f.ph += dt;
    f.vx += (Math.random() - 0.5) * 40 * dt + (f.hx - f.x) * 0.02 * dt; f.vy += (Math.random() - 0.5) * 40 * dt + (f.hy - f.y) * 0.02 * dt;
    f.vx *= 0.98; f.vy *= 0.98; f.x += f.vx * dt; f.y += f.vy * dt;
  }
  for (const b of butterflies) {
    b.ph += dt * 12;
    if (b.wait > 0) { b.wait -= dt; continue; }
    if (!b.tx || Math.hypot(b.tx - b.x, b.ty - b.y) < 3) {
      b.tx = (20 + Math.random() * 12) * TS; b.ty = (10 + Math.random() * 8) * TS;
      if (Math.random() < 0.3) b.wait = 1 + Math.random() * 2;
    }
    const a = Math.atan2(b.ty - b.y, b.tx - b.x);
    b.x += Math.cos(a) * 18 * dt; b.y += Math.sin(a) * 18 * dt + Math.sin(b.ph * 0.4) * 10 * dt;
  }
}
function newDrop(anyY) {
  const y = anyY ? Math.random() * view.h : -8 - Math.random() * 30, spd = 210 + Math.random() * 70;
  return { x: Math.random() * (view.w + 40), y, spd, len: 4 + Math.floor(Math.random() * 4), life: Math.max(0.05, (Math.random() * view.h - y) / spd) };
}
function blocked(x, y) {
  const L = x - 5, R = x + 5, T = y - 4, B = y + 1;
  if (!walkable(L, T) || !walkable(R, T) || !walkable(L, B) || !walkable(R, B)) return true;
  return colliders.some(c => L < c.x + c.w && R > c.x && T < c.y + c.h && B > c.y);
}

function render() {
  const vw = view.w, vh = view.h, LT = lightAt(hourOf());
  const dark = Math.min(0.72, LT.dark + 0.12 * rainI), lit = dark > 0.12;
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#327bb2'; ctx.fillRect(0, 0, vw, vh);
  ctx.drawImage(GROUND.ground, -camX, -camY);
  const wave = Math.sin(time * 1.6);
  ctx.globalAlpha = 0.55 + 0.45 * wave; ctx.drawImage(GROUND.foamA, -camX, -camY);
  ctx.globalAlpha = 0.55 - 0.45 * wave; ctx.drawImage(GROUND.foamB, -camX, -camY);
  ctx.globalAlpha = 1;
  // блики на воде
  ctx.fillStyle = 'rgba(220,245,255,.75)';
  for (let ty = Math.floor(camY / TS); ty <= (camY + vh) / TS; ty++) for (let tx = Math.floor(camX / TS); tx <= (camX + vw) / TS; tx++) {
    const h = hash(tx * 7, ty * 13);
    if (h > 0.4 || landV(tx + 0.5, ty + 0.5) > -1.2 || onPier(tx * TS + 8, ty * TS + 8)) continue;
    const ph = (time * 0.7 + h * 20) % 3;
    if (ph < 1.2) ctx.fillRect(tx * TS + Math.floor(h * 30) % 12 - camX, ty * TS + Math.floor(h * 97) % 13 - camY, ph < 0.6 ? 3 : 2, 1);
  }
  // лодка качается
  const bob = Math.round(Math.sin(time * 1.3));
  ctx.fillStyle = 'rgba(220,245,255,.6)';
  ctx.fillRect(BOAT.x - camX + 2, BOAT.y + 16 + bob - camY, 36, 1);
  blit(SPR.boat, BOAT.x - 1, BOAT.y - 1 + bob);
  // грядки
  for (const b of state.beds) blit(b.wet > 0 ? SPR.bedWet : SPR.bedDry, b.tx * TS, b.ty * TS);
  const tgt = targetTile(), tool = TOOLS[state.sel].key;
  if (tool === 'hammer' && state.bag.bed > 0 && canBuild(tgt.tx, tgt.ty) && !paused()) {
    ctx.globalAlpha = 0.45 + 0.15 * Math.sin(time * 6); blit(SPR.bedDry, tgt.tx * TS, tgt.ty * TS); ctx.globalAlpha = 1;
  }
  // объекты по глубине
  const list = [];
  for (const p of props) list.push(p);
  for (const b of state.beds) if (b.crop) list.push({ y: b.ty * TS + 14, crop: b });
  list.push({ y: player.y, who: 'player' }, { y: TRADER.ty * TS + 14, who: 'trader' });
  list.sort((a, b) => a.y - b.y);
  for (const o of list) {
    if (o.crop) {
      const b = o.crop, st = stageOf(b);
      const spr = b.crop === 'wheat' ? SPR.wheat[st === 4 ? 4 + (Math.floor(time * 1.5 + b.tx * 0.7 + b.ty * 0.3) % 2) : st] : SPR.carrot[st];
      blit(spr, b.tx * TS, b.ty * TS - 8);
      if (st === 4 && (time * 0.8 + hash(b.tx, b.ty) * 5) % 2.5 < 0.35) {
        const sx = b.tx * TS + 4 + Math.floor(hash(b.ty, b.tx) * 8) - camX, sy = b.ty * TS - 6 - camY;
        ctx.fillStyle = '#fffbe0'; ctx.fillRect(sx, sy - 1, 1, 3); ctx.fillRect(sx - 1, sy, 3, 1);
      }
    } else if (o.who === 'player') drawPlayer();
    else if (o.who === 'trader') {
      const tx = TRADER.tx * TS + 8, ty = TRADER.ty * TS + 14;
      const dx = player.x - tx, dy = player.y - ty, near = Math.hypot(dx, dy) < 56;
      const dir = near ? (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 3) : (dy > 0 ? 0 : 1)) : (Math.floor(time / 3) % 4 === 3 ? 3 : 0);
      shadow(tx, ty, 5);
      blit(SPR.trader[dir][0], tx - 9, ty - 23 + (Math.floor(time * 2) % 2));
      if (near && !paused()) { ctx.fillStyle = '#fff6de'; const sx = tx - camX, sy = ty - 34 - camY + Math.round(Math.sin(time * 4)); ctx.fillRect(sx - 1, sy, 3, 4); ctx.fillRect(sx - 1, sy + 5, 3, 2); }
    } else {
      if (o.shadow) shadow(o.x, o.y, o.shadow);
      blit(o.lamp ? (lit ? SPR.lampLit : SPR.lamp) : o.spr, o.x - o.ox, o.y - o.oy);
      if (o.spr === SPR.house) drawWindows(dark);
    }
  }
  // дым
  for (const s of smoke) {
    ctx.fillStyle = `rgba(225,225,230,${0.55 * (1 - s.t / s.life)})`;
    ctx.fillRect(Math.round(s.x) - camX, Math.round(s.y) - camY, s.s + Math.floor(s.t), s.s + Math.floor(s.t));
  }
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, 1 - (p.t / p.life) ** 2); ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x) - camX, Math.round(p.y) - camY, 1, 1);
  }
  ctx.globalAlpha = 1;
  // бабочки днём
  if (dark < 0.2 && rainI < 0.3) for (const b of butterflies) {
    const sx = Math.round(b.x) - camX, sy = Math.round(b.y) - camY, open = Math.sin(b.ph) > 0;
    ctx.fillStyle = b.c;
    if (open) { ctx.fillRect(sx - 2, sy, 2, 2); ctx.fillRect(sx + 1, sy, 2, 2); } else { ctx.fillRect(sx - 1, sy, 1, 2); ctx.fillRect(sx + 1, sy, 1, 2); }
    ctx.fillStyle = '#3a2418'; ctx.fillRect(sx, sy, 1, 2);
  }
  // дождь
  if (rainI > 0.01) {
    ctx.fillStyle = 'rgba(195,215,245,.6)';
    for (const d of drops) ctx.fillRect(Math.round(d.x), Math.round(d.y), 1, d.len);
    ctx.fillStyle = 'rgba(215,235,255,.7)';
    for (const s of splashes) {
      const sx = Math.round(s.x) - camX, sy = Math.round(s.y) - camY;
      if (s.t < 0.12) { ctx.fillRect(sx - 1, sy, 1, 1); ctx.fillRect(sx + 1, sy, 1, 1); ctx.fillRect(sx, sy - 1, 1, 1); }
      else { ctx.fillRect(sx - 2, sy, 1, 1); ctx.fillRect(sx + 2, sy, 1, 1); ctx.fillRect(sx - 1, sy - 1, 3, 1); }
    }
  }
  // освещение
  if (LT.tintA > 0.01) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgba(${LT.tint[0]},${LT.tint[1]},${LT.tint[2]},${LT.tintA})`; ctx.fillRect(0, 0, vw, vh);
  }
  if (rainI > 0.01) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgba(120,135,165,${0.45 * rainI})`; ctx.fillRect(0, 0, vw, vh);
  }
  ctx.globalCompositeOperation = 'source-over';
  if (dark > 0.01) {
    lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, vw, vh);
    lctx.fillStyle = `rgba(10,14,46,${dark})`; lctx.fillRect(0, 0, vw, vh);
    lctx.globalCompositeOperation = 'destination-out';
    for (const L of LIGHTS) {
      const sx = L.x - camX, sy = L.y - camY, r = L.r + Math.sin(time * 3 + L.x) * 1.5;
      if (sx < -r || sy < -r || sx > vw + r || sy > vh + r) continue;
      const gr = lctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      gr.addColorStop(0, 'rgba(0,0,0,.95)'); gr.addColorStop(0.5, 'rgba(0,0,0,.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = gr; lctx.fillRect(sx - r, sy - r, r * 2, r * 2);
    }
    ctx.drawImage(lightC, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    for (const L of LIGHTS) {
      const sx = L.x - camX, sy = L.y - camY, r = L.r * 0.6;
      const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      gr.addColorStop(0, `rgba(255,190,90,${0.4 * dark})`); gr.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = gr; ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
    }
    if (dark > 0.3 && rainI < 0.3) for (const f of flies) {
      const a = (Math.sin(f.ph * 2.3) * 0.5 + 0.5) * (dark - 0.3) * 3;
      if (a < 0.1) continue;
      const sx = Math.round(f.x) - camX, sy = Math.round(f.y) - camY;
      ctx.fillStyle = `rgba(200,255,120,${a * 0.35})`; ctx.fillRect(sx - 1, sy - 1, 3, 3);
      ctx.fillStyle = `rgba(240,255,170,${a})`; ctx.fillRect(sx, sy, 1, 1);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // рамка цели
  if (!paused()) {
    const a = getAction();
    if (a) {
      ctx.fillStyle = a.run ? 'rgba(255,250,225,.95)' : 'rgba(255,250,225,.4)';
      const x = tgt.tx * TS - camX, y = tgt.ty * TS - camY, k = a.run && Math.floor(time * 3) % 2 ? 1 : 0;
      for (const [cx, cy, sx, sy] of [[x - k, y - k, 1, 1], [x + 15 + k, y - k, -1, 1], [x - k, y + 15 + k, 1, -1], [x + 15 + k, y + 15 + k, -1, -1]]) {
        ctx.fillRect(sx > 0 ? cx : cx - 3, cy, 4, 1); ctx.fillRect(cx, sy > 0 ? cy : cy - 3, 1, 4);
      }
    }
  }
}
function drawWindows(dark) {
  const night = dark > 0.15;
  for (const w of WINDOWS) {
    const x = w.x - camX, y = w.y - camY;
    ctx.fillStyle = night ? '#ffd66b' : '#9fd3e8'; ctx.fillRect(x, y, 12, 9);
    ctx.fillStyle = night ? '#fff0b0' : '#d8f0f8'; ctx.fillRect(x + 1, y + 1, 2, 2); ctx.fillRect(x + 7, y + 1, 1, 1);
    ctx.fillStyle = '#6e4527'; ctx.fillRect(x + 5, y, 2, 9); ctx.fillRect(x, y + 4, 12, 1);

}
function drawPlayer() {

        ${seed ? `<br><button class="px ${inHand ? 'alt' : ''}" data-hand="${k}">${inHand ? 'В руке' : 'Взять'}</button>` : ''}</div>`;
    }).join('')}</div>
    <div class="foot">Грядки ставятся молотком (1), сносятся кувалдой (2) — и возвращаются сюда.<br>Лейка (3): ${state.water}/${CAN_MAX}. Набрать воду — у берега или в колодце.</div>
    <div style="text-align:right;margin-top:10px"><button class="px red" data-reset="1">Начать заново</button></div>`);
}

// ================= цикл =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); updateHUD(false);
  requestAnimationFrame(frame);
}
setInterval(() => { if (!paused()) save(); }, 4000);
addEventListener('beforeunload', save);
addEventListener('pagehide', save);
updateCamera(); updateHUD(true);
if (freshGame) toast('Добро пожаловать на остров! Пшеница на грядках уже созрела — собери её (E).');
requestAnimationFrame(frame);
</script>
</body>
</html>
